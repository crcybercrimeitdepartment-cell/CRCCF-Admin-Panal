  <body class="bg-[#F8FAF9] text-[#0F172A] antialiased selection:bg-slate-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Google Translate Widget (Hidden via CSS) -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
      }

      // Bulletproof banner hider (DO NOT REMOVE elements, it breaks the API)
      const observer = new MutationObserver((mutations) => {
        const banner = document.querySelector('.goog-te-banner-frame');
        const skiptranslate = document.querySelectorAll('.skiptranslate');
        
        if (banner) {
          banner.style.display = 'none';
          banner.style.visibility = 'hidden';
        }
        
        document.body.style.top = '0px';
        
        skiptranslate.forEach(el => {
          if (el.tagName.toLowerCase() === 'iframe') {
            el.style.display = 'none';
            el.style.visibility = 'hidden';
          }
          if (el.style.position === 'absolute' || el.style.position === 'fixed') {
            el.style.display = 'none';
            el.style.visibility = 'hidden';
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
